<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ff">
<title>アイプリ カード管理</title>
<style>
:root{--bg:#f7f5ff;--panel:#fff;--text:#292536;--muted:#7b7488;--line:#e9e5f2;--accent:#7c5cff;--accent2:#ff77b7;--shadow:0 8px 30px #40308012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:1200px;margin:auto;padding:16px 18px;display:flex;align-items:center;gap:12px}.logo{font-weight:900;font-size:21px}.logo span{color:var(--accent)}
main{max-width:1200px;margin:auto;padding:18px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px}
.toprow{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;font-size:15px;background:#faf9fd}
button,.filebtn{border:0;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer;font-size:14px}
.primary{background:var(--accent);color:#fff}.secondary{background:#f0edff;color:#5940d0}.danger{background:#fff0f4;color:#c33d6c}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
select,input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)}
.summary{display:flex;justify-content:space-between;align-items:center;margin:15px 2px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.thumb{aspect-ratio:0.7;background:#f0eef5;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.noimg{font-size:12px;color:var(--muted);padding:15px;text-align:center}.info{padding:10px}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:5px;line-height:1.6}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;padding:3px 6px;border-radius:999px;background:#f1eff8}.rarity{background:#fff0fa;color:#d14b9a}
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9d3e7;border-radius:20px}
dialog{width:min(560px,calc(100% - 24px));border:0;border-radius:22px;padding:0;box-shadow:0 20px 70px #24174a40}dialog::backdrop{background:#21173355;backdrop-filter:blur(3px)}
.modal{padding:20px}.modal h2{margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.label{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}
.preview{width:150px;height:210px;object-fit:cover;border-radius:12px;background:#f0eef5;display:block;margin-bottom:12px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.importbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:11px;color:var(--muted)}
@media(max-width:600px){main{padding:12px}.filters{grid-template-columns:1fr 1fr}.filters select:last-child{grid-column:1/-1}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border-radius:13px}.info{padding:8px}.name{font-size:12px}.toprow button{flex:1}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">アイプリ <span>カード管理</span></div><div style="margin-left:auto" class="small" id="countHead"></div></div></header>
<main>
<section class="toolbar">
  <div class="toprow">
    <input id="search" class="search" placeholder="カード名・番号・メモを検索…">
    <label class="filebtn primary">📷 写真・ファイルから追加<input id="file" type="file" accept="image/*" multiple hidden></label>
    <button class="secondary" id="export">バックアップ</button>
    <label class="filebtn secondary">復元<input id="restore" type="file" accept=".json" hidden></label>
  </div>
  <div class="filters">
    <select id="season"><option value="">弾数：すべて</option></select>
    <select id="type"><option value="">タイプ：すべて</option></select>
    <select id="rarity"><option value="">レア度：すべて</option></select>
  </div>
</section>
<div class="summary"><span id="summary"></span><button class="danger" id="clearAll">全データ削除</button></div>
<section id="grid" class="grid"></section>
</main>

<dialog id="dlg">
<div class="modal">
<h2 id="dlgTitle">カードを追加</h2>
<img id="preview" class="preview" alt="">
<div class="form">
<div><div class="label">カード名</div><input id="name" type="text" placeholder="例：○○"></div>
<div><div class="label">カード番号</div><input id="number" type="text" placeholder="例：BP01-001"></div>
<div><div class="label">弾数</div><input id="dSeason" type="text" placeholder="例：第1弾"></div>
<div><div class="label">タイプ</div><input id="dType" type="text" placeholder="例：ラブリー"></div>
<div><div class="label">レア度</div><input id="dRarity" type="text" placeholder="例：PR / R / SR"></div>
<div><div class="label">メモ</div><input id="note" type="text" placeholder="ダブり・未所持など"></div>
</div>
<div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div>
</div>
</dialog>

<script>
const KEY='aipri-card-manager-v1';
let cards=JSON.parse(localStorage.getItem(KEY)||'[]');
let pendingImage='', editId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(cards)); render(); fillFilters();}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function options(id, vals, label){let el=$(id), cur=el.value; el.innerHTML=`<option value="">${label}：すべて</option>`+[...new Set(vals.filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join(''); el.value=cur;}
function fillFilters(){options('season',cards.map(c=>c.season),'弾数');options('type',cards.map(c=>c.type),'タイプ');options('rarity',cards.map(c=>c.rarity),'レア度');}
function filtered(){
 let q=$('search').value.toLowerCase().trim(), s=$('season').value,t=$('type').value,r=$('rarity').value;
 return cards.filter(c=>(!q||[c.name,c.number,c.note,c.season,c.type,c.rarity].join(' ').toLowerCase().includes(q))&&(!s||c.season===s)&&(!t||c.type===t)&&(!r||c.rarity===r));
}
function render(){
 let arr=filtered(); $('countHead').textContent=`全${cards.length}枚`;
 $('summary').textContent=`${arr.length}枚表示 / 全${cards.length}枚`;
 $('grid').innerHTML=arr.length?arr.map(c=>`
 <article class="card" data-id="${c.id}">
  <div class="thumb">${c.image?`<img src="${c.image}" alt="">`:'<div class="noimg">画像なし</div>'}</div>
  <div class="info"><div class="name">${esc(c.name||'名称未設定')}</div>
  <div class="meta">${esc(c.number)}${c.season?' · '+esc(c.season):''}</div>
  <div class="tags">${c.type?`<span class="tag">${esc(c.type)}</span>`:''}${c.rarity?`<span class="tag rarity">${esc(c.rarity)}</span>`:''}</div></div>
 </article>`).join(''):`<div class="empty" style="grid-column:1/-1">まだカードがありません。<br><br>「📷 写真・ファイルから追加」からカード画像を選んでみて！</div>`;
 document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openEdit(x.dataset.id));
}
function openEdit(id=null){
 editId=id; let c=id?cards.find(x=>x.id===id):null;
 $('dlgTitle').textContent=c?'カードを編集':'カードを追加';
 pendingImage=c?.image||''; $('preview').src=pendingImage||''; $('preview').style.display=pendingImage?'block':'none';
 ['name','number','dSeason','dType','dRarity','note'].forEach((k,i)=>$(k).value=c?[c.name,c.number,c.season,c.type,c.rarity,c.note][i]:'');
 $('dlg').showModal();
}
$('file').onchange=e=>{
 [...e.target.files].forEach(file=>{
  const rd=new FileReader(); rd.onload=ev=>{pendingImage=ev.target.result;openEdit();}; rd.readAsDataURL(file);
 }); e.target.value='';
};
$('save').onclick=()=>{
 const data={id:editId||crypto.randomUUID(),image:pendingImage,name:$('name').value.trim(),number:$('number').value.trim(),season:$('dSeason').value.trim(),type:$('dType').value.trim(),rarity:$('dRarity').value.trim(),note:$('note').value.trim()};
 if(editId) cards=cards.map(c=>c.id===editId?data:c); else cards.unshift(data);
 $('dlg').close(); save();
};
$('cancel').onclick=()=>{$('dlg').close()};
['search','season','type','rarity'].forEach(id=>$(id).addEventListener('input',render));
$('grid').addEventListener('contextmenu',e=>e.preventDefault());
$('export').onclick=()=>{
 const blob=new Blob([JSON.stringify(cards)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aipri-card-backup.json';a.click();
};
$('restore').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{cards=JSON.parse(rd.result);save();alert('復元しました！')}catch{alert('バックアップファイルを読み込めませんでした')}};rd.readAsText(f);e.target.value='';
};
$('clearAll').onclick=()=>{if(confirm('カード情報をすべて削除します。バックアップはありますか？')){cards=[];save()}};
fillFilters();render();
</script>
</body>
</html>
